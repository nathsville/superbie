<style>
  :root {
    color-scheme: dark;
    --bg-deep: #040812;
    --bg-main: #07111f;
    --surface: rgba(9, 23, 40, 0.82);
    --surface-solid: #0c1c30;
    --surface-raised: #10263d;
    --surface-soft: rgba(18, 42, 66, 0.56);
    --border: rgba(127, 210, 255, 0.15);
    --border-strong: rgba(127, 210, 255, 0.28);
    --text: #f4f9ff;
    --text-soft: #c4d2df;
    --muted: #8fa6ba;
    --cyan: #45dcff;
    --cyan-bright: #8cecff;
    --blue: #6684ff;
    --violet: #9b7cff;
    --normal: #34d399;
    --warning: #fdb74b;
    --danger: #ff6377;
    --danger-soft: rgba(255, 99, 119, 0.12);
    --radius-xl: 22px;
    --radius-lg: 17px;
    --radius-md: 13px;
    --shadow-panel: 0 20px 60px rgba(0, 4, 12, 0.34);
    --shadow-glow: 0 0 36px rgba(69, 220, 255, 0.1);
    --font-body: "Manrope", "Segoe UI", sans-serif;
    --font-display: "Space Grotesk", "Manrope", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    min-width: 320px;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    color: var(--text);
    background:
      radial-gradient(circle at 15% -10%, rgba(50, 120, 255, 0.18), transparent 30rem),
      radial-gradient(circle at 95% 8%, rgba(0, 211, 255, 0.1), transparent 29rem),
      linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-main) 52%, #06101c 100%);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    content: "";
    background-image:
      linear-gradient(rgba(103, 197, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(103, 197, 255, 0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(to bottom, black 0%, transparent 88%);
  }

  button, input, select, textarea { font: inherit; }
  button { color: inherit; }
  h1, h2, h3, p { margin-top: 0; }

  ::selection { color: #021017; background: var(--cyan); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.025); }
  ::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(142, 176, 201, 0.28); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(142, 176, 201, 0.44); }

  :focus-visible {
    outline: 3px solid rgba(69, 220, 255, 0.58) !important;
    outline-offset: 3px;
  }

  .skip-link {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 2000;
    padding: 10px 14px;
    color: #04121c;
    background: var(--cyan);
    border-radius: 9px;
    font-weight: 800;
    transform: translateY(-180%);
    transition: transform 0.2s ease;
  }

  .skip-link:focus { transform: translateY(0); }

  .ambient-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .ambient-orb {
    position: absolute;
    width: 26rem;
    height: 26rem;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.13;
  }

  .ambient-orb--one { top: 18%; left: -15rem; background: #147cff; }
  .ambient-orb--two { right: -14rem; bottom: 4%; background: #20d8ff; }

  .command-header {
    position: sticky;
    top: 0;
    z-index: 1030;
    display: flex;
    min-height: 92px;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    padding: 14px clamp(18px, 2.35vw, 42px);
    border-bottom: 1px solid rgba(116, 204, 255, 0.14);
    background: rgba(4, 11, 21, 0.84);
    box-shadow: 0 14px 38px rgba(0, 4, 12, 0.22);
    backdrop-filter: blur(24px) saturate(135%);
  }

  .command-header::after {
    position: absolute;
    right: 8%;
    bottom: -1px;
    width: 25%;
    height: 1px;
    content: "";
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    box-shadow: 0 0 12px var(--cyan);
  }

  .brand-block, .header-operations, .header-actions, .system-health, .context-strip__item,
  .weather-hero__topline, .risk-console__header, .panel-heading, .analytics-kpi,
  .dss-intro, .dashboard-footer {
    display: flex;
    align-items: center;
  }

  .brand-block { min-width: 0; gap: 14px; }

  .brand-emblem {
    position: relative;
    display: grid;
    width: 58px;
    height: 64px;
    flex: 0 0 58px;
    place-items: center;
    overflow: visible;
  }

  .brand-emblem::before {
    position: absolute;
    inset: 7px 1px;
    content: "";
    border: 1px solid rgba(69, 220, 255, 0.13);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(69, 220, 255, 0.11), transparent 68%);
    box-shadow: 0 0 28px rgba(69, 220, 255, 0.11);
  }

  .brand-emblem__image {
    position: relative;
    z-index: 1;
    width: auto;
    height: 60px;
    object-fit: contain;
    filter: drop-shadow(0 7px 10px rgba(0, 0, 0, 0.35));
    user-select: none;
  }

  @keyframes orbit-spin { to { transform: rotate(360deg); } }

  .brand-copy { min-width: 0; }

  .brand-kicker {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 3px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .brand-kicker__dot, .system-health__pulse, .live-chip i, .risk-signal i,
  .freshness-pill > span, .dss-status > span {
    display: inline-block;
    width: 7px;
    height: 7px;
    flex: 0 0 7px;
    border-radius: 50%;
    background: var(--normal);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.1), 0 0 10px rgba(52, 211, 153, 0.7);
  }

  .brand-copy h1 {
    margin: 0;
    color: var(--text);
    font-family: var(--font-display);
    font-size: clamp(18px, 1.55vw, 25px);
    font-weight: 650;
    letter-spacing: -0.035em;
    line-height: 1.15;
    white-space: nowrap;
  }

  .brand-copy h1 span {
    color: var(--cyan-bright);
    background: linear-gradient(100deg, var(--text) 5%, var(--cyan) 75%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand-copy p {
    margin: 3px 0 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.035em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .header-operations { flex: 0 0 auto; justify-content: flex-end; gap: 20px; }

  .system-health {
    gap: 10px;
    padding-right: 19px;
    border-right: 1px solid var(--border);
  }

  .system-health > span:last-child { display: flex; flex-direction: column; }
  .system-health small, .time-console__meta { color: var(--muted); font-size: 9px; font-weight: 600; letter-spacing: 0.06em; }
  .system-health strong { color: var(--text-soft); font-size: 11px; font-weight: 700; }

  .system-health__pulse, .live-chip i, .risk-signal i { animation: status-pulse 2.4s ease-out infinite; }

  @keyframes status-pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.08), 0 0 8px rgba(52, 211, 153, 0.55); }
    50% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0), 0 0 15px rgba(52, 211, 153, 0.75); }
  }

  .time-console { min-width: 185px; text-align: right; }

  .time-console__clock {
    color: var(--text);
    font-family: var(--font-display);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1.1;
  }

  .time-console__clock::after { margin-left: 5px; color: var(--cyan); content: "WITA"; font-size: 8px; letter-spacing: 0.09em; vertical-align: 4px; }
  .time-console__meta { display: flex; flex-direction: column; margin-top: 4px; letter-spacing: 0; line-height: 1.45; }
  .time-console__meta strong { color: var(--text-soft); font-weight: 600; }

  .header-actions { gap: 8px; }

  .btn-command {
    display: inline-flex;
    min-height: 42px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 15px;
    border: 1px solid transparent;
    border-radius: 11px;
    font-size: 11px;
    font-weight: 750;
    letter-spacing: 0.015em;
    transition: 0.22s ease;
  }

  .btn-command:disabled { cursor: wait; opacity: 0.65; }
  .btn-command:not(:disabled):hover { transform: translateY(-1px); }
  .btn-command--primary { color: #03121c; background: linear-gradient(135deg, #86edff, #3ed4ff 58%, #61a6ff); box-shadow: 0 8px 25px rgba(45, 201, 255, 0.18); }
  .btn-command--primary:not(:disabled):hover { box-shadow: 0 10px 32px rgba(45, 201, 255, 0.28); }
  .btn-command--ghost { color: var(--text-soft); border-color: var(--border-strong); background: rgba(12, 30, 50, 0.68); }
  .btn-command--ghost:hover { color: var(--text); border-color: rgba(108, 218, 255, 0.42); background: rgba(18, 47, 76, 0.78); }

  .dashboard-shell {
    width: min(100%, 1760px);
    min-height: calc(100vh - 92px);
    margin: 0 auto;
    padding: 18px clamp(14px, 2vw, 34px) 24px;
  }

  .context-strip {
    display: flex;
    min-height: 57px;
    align-items: center;
    gap: 18px;
    padding: 9px 16px;
    border: 1px solid rgba(123, 208, 255, 0.11);
    border-radius: var(--radius-lg);
    background: rgba(7, 19, 33, 0.52);
    backdrop-filter: blur(14px);
  }

  .context-strip__item { min-width: 0; gap: 10px; }
  .context-strip__item > span:last-child { display: flex; min-width: 0; flex-direction: column; }
  .context-strip__item small { color: var(--muted); font-size: 8px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .context-strip__item strong { overflow: hidden; color: var(--text-soft); font-size: 10px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }

  .context-icon {
    display: grid;
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    place-items: center;
    color: var(--cyan);
    border: 1px solid rgba(69, 220, 255, 0.17);
    border-radius: 9px;
    background: rgba(69, 220, 255, 0.07);
  }

  .context-divider { width: 1px; height: 26px; flex: 0 0 1px; background: var(--border); }

  .freshness-pill, .live-chip, .risk-signal, .dss-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #a9ead2;
    border: 1px solid rgba(52, 211, 153, 0.18);
    border-radius: 999px;
    background: rgba(52, 211, 153, 0.07);
    font-size: 9px;
    font-weight: 750;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .freshness-pill { padding: 7px 10px; }
  .freshness-pill.is-cached { color: #f4ca81; border-color: rgba(253, 183, 75, 0.22); background: rgba(253, 183, 75, 0.08); }
  .freshness-pill.is-cached > span { background: var(--warning); box-shadow: 0 0 0 4px rgba(253, 183, 75, 0.1), 0 0 10px rgba(253, 183, 75, 0.6); }

  .ews-region:empty { display: none; }
  .ews-region { margin-top: 14px; }

  .ews-banner {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    overflow: hidden;
    padding: 13px 16px;
    border: 1px solid;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-panel);
  }

  .ews-banner::before { position: absolute; inset: 0 auto 0 0; width: 3px; content: ""; background: currentColor; box-shadow: 0 0 14px currentColor; }
  .ews-banner--waspada { color: #ffd792; border-color: rgba(253, 183, 75, 0.25); background: linear-gradient(90deg, rgba(253, 183, 75, 0.12), rgba(14, 28, 45, 0.78) 56%); }
  .ews-banner--siaga { color: #ff9caa; border-color: rgba(255, 99, 119, 0.3); background: linear-gradient(90deg, rgba(255, 99, 119, 0.14), rgba(14, 28, 45, 0.8) 58%); }
  .ews-banner__icon { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 11px; background: currentColor; }
  .ews-banner__icon i { color: #111c28; font-size: 17px; }
  .ews-banner__copy { min-width: 0; }
  .ews-banner__copy strong { display: block; color: currentColor; font-size: 11px; letter-spacing: 0.035em; }
  .ews-banner__copy p { margin: 2px 0 0; color: var(--text-soft); font-size: 10px; }

  .dashboard-nav-wrap {
    position: sticky;
    top: 92px;
    z-index: 1020;
    margin: 14px 0;
    padding: 5px;
    border: 1px solid rgba(127, 210, 255, 0.12);
    border-radius: 15px;
    background: rgba(5, 14, 25, 0.84);
    box-shadow: 0 12px 35px rgba(0, 4, 12, 0.2);
    backdrop-filter: blur(20px);
  }

  .dashboard-nav { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .dashboard-nav::-webkit-scrollbar { display: none; }
  .dashboard-nav .nav-item { flex: 1 0 auto; }

  .dashboard-nav .nav-link {
    position: relative;
    display: flex;
    width: 100%;
    min-height: 43px;
    align-items: center;
    justify-content: center;
    gap: 9px;
    overflow: hidden;
    padding: 8px 16px;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .dashboard-nav .nav-link i { color: #7893aa; font-size: 13px; transition: color 0.2s ease; }
  .dashboard-nav .nav-link:hover { color: var(--text-soft); background: rgba(110, 203, 255, 0.05); }
  .dashboard-nav .nav-link.active { color: var(--text); border-color: rgba(87, 216, 255, 0.18); background: linear-gradient(120deg, rgba(47, 155, 222, 0.18), rgba(35, 75, 124, 0.12)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04); }
  .dashboard-nav .nav-link.active i { color: var(--cyan); text-shadow: 0 0 15px rgba(69, 220, 255, 0.6); }
  .dashboard-nav .nav-link::after { position: absolute; right: 24%; bottom: 0; left: 24%; height: 2px; content: ""; border-radius: 99px 99px 0 0; background: transparent; }
  .dashboard-nav .nav-link.active::after { background: linear-gradient(90deg, transparent, var(--cyan), transparent); box-shadow: 0 0 11px var(--cyan); }

  .dashboard-content { min-height: 560px; }
  .tab-pane { outline: none; }
  .tab-pane.show { opacity: 1; }

  .command-card, .metric-card, .analytics-kpi {
    position: relative;
    border: 1px solid var(--border);
    background: linear-gradient(145deg, rgba(14, 34, 55, 0.88), rgba(7, 20, 35, 0.88));
    box-shadow: var(--shadow-panel), inset 0 1px 0 rgba(255, 255, 255, 0.025);
    backdrop-filter: blur(16px);
  }

  .command-card { border-radius: var(--radius-xl); }
  .overview-grid { display: grid; grid-template-columns: minmax(0, 1.58fr) minmax(330px, 0.82fr); gap: 14px; }

  .section-eyebrow {
    display: block;
    margin-bottom: 5px;
    color: var(--cyan);
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.17em;
    line-height: 1.3;
    text-transform: uppercase;
  }

  .weather-hero {
    min-height: 300px;
    overflow: hidden;
    padding: 24px;
    background:
      linear-gradient(110deg, rgba(15, 47, 76, 0.94), rgba(7, 22, 39, 0.9) 62%),
      radial-gradient(circle at 25% 50%, rgba(69, 220, 255, 0.13), transparent 30%);
  }

  .weather-hero::before {
    position: absolute;
    top: -50%;
    right: -7%;
    width: 420px;
    height: 420px;
    content: "";
    border: 1px solid rgba(81, 208, 255, 0.08);
    border-radius: 50%;
    box-shadow: inset 0 0 0 45px rgba(64, 190, 255, 0.018), inset 0 0 0 95px rgba(64, 190, 255, 0.018);
  }

  .weather-hero::after {
    position: absolute;
    right: 20px;
    bottom: 0;
    left: 20px;
    height: 1px;
    content: "";
    background: linear-gradient(90deg, transparent, rgba(69, 220, 255, 0.42), transparent);
  }

  .weather-hero__topline { position: relative; z-index: 1; justify-content: space-between; gap: 16px; }
  .weather-location { margin: 0; color: var(--muted); font-size: 10px; font-weight: 600; }
  .weather-location i { margin-right: 5px; color: var(--cyan); }
  .live-chip, .risk-signal { padding: 7px 10px; }

  .weather-hero__content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: clamp(20px, 4vw, 54px);
    min-height: 153px;
    padding: 11px 0 14px;
  }

  .weather-symbol { position: relative; display: grid; width: 112px; height: 112px; flex: 0 0 112px; place-items: center; }
  .weather-symbol__halo { position: absolute; inset: 9px; border: 1px solid rgba(89, 221, 255, 0.2); border-radius: 50%; background: radial-gradient(circle, rgba(69, 220, 255, 0.17), rgba(69, 220, 255, 0.02) 60%, transparent 61%); box-shadow: 0 0 45px rgba(69, 220, 255, 0.13); }
  .weather-symbol__halo::before, .weather-symbol__halo::after { position: absolute; inset: -8px; content: ""; border: 1px dashed rgba(110, 215, 255, 0.15); border-radius: 50%; }
  .weather-symbol__halo::after { inset: 11px; border-style: solid; border-color: rgba(255, 255, 255, 0.045); }
  .weather-symbol > i { position: relative; z-index: 1; color: #f9cb6b; font-size: 46px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.36)); }
  .weather-symbol.is-rain > i { color: #69d6ff; }
  .weather-symbol.is-storm > i { color: #a991ff; }
  .weather-symbol.is-clear > i { color: #ffd16f; }
  .weather-symbol.is-cloud > i { color: #b8ddf0; }
  .weather-symbol.is-rain .weather-symbol__halo { border-color: rgba(76, 190, 255, 0.24); background: radial-gradient(circle, rgba(69, 177, 255, 0.16), rgba(69, 177, 255, 0.02) 60%, transparent 61%); }
  .weather-symbol.is-storm .weather-symbol__halo { border-color: rgba(155, 124, 255, 0.28); background: radial-gradient(circle, rgba(155, 124, 255, 0.18), rgba(155, 124, 255, 0.02) 60%, transparent 61%); }

  .temperature-block { min-width: 0; }
  .temperature-value { color: var(--text); font-family: var(--font-display); font-size: clamp(58px, 6vw, 84px); font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.075em; line-height: 0.9; text-shadow: 0 0 32px rgba(97, 198, 255, 0.14); }
  .temperature-value sup { margin-left: 7px; color: var(--cyan-bright); font-family: var(--font-body); font-size: 18px; font-weight: 600; letter-spacing: 0; vertical-align: top; }
  .temperature-block h2 { margin: 12px 0 3px; overflow: hidden; color: var(--text); font-family: var(--font-display); font-size: clamp(17px, 1.6vw, 22px); font-weight: 600; letter-spacing: -0.02em; text-overflow: ellipsis; white-space: nowrap; }
  .temperature-block p { margin: 0; color: var(--muted); font-size: 10px; }

  .weather-hero__footer { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .atmosphere-stat { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; padding: 9px 11px; border: 1px solid rgba(129, 211, 255, 0.1); border-radius: 10px; background: rgba(2, 14, 26, 0.34); }
  .atmosphere-stat span { overflow: hidden; color: var(--muted); font-size: 9px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .atmosphere-stat span i { width: 14px; margin-right: 3px; color: var(--cyan); text-align: center; }
  .atmosphere-stat strong { color: var(--text-soft); font-family: var(--font-display); font-size: 11px; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

  .risk-console {
    --risk-color: var(--normal);
    min-height: 300px;
    overflow: hidden;
    padding: 24px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--risk-color) 10%, #10243a), rgba(7, 20, 35, 0.92) 66%);
    transition: border-color 0.25s ease, background 0.25s ease;
  }

  .risk-console::before { position: absolute; top: 0; right: 18px; left: 18px; height: 2px; content: ""; background: linear-gradient(90deg, transparent, var(--risk-color), transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--risk-color) 60%, transparent); }
  .risk-console[data-risk="waspada"] { --risk-color: var(--warning); border-color: rgba(253, 183, 75, 0.25); }
  .risk-console[data-risk="siaga"] { --risk-color: var(--danger); border-color: rgba(255, 99, 119, 0.3); }
  .risk-console__header { justify-content: space-between; gap: 12px; }
  .risk-console__header p { margin: 0; color: var(--muted); font-size: 10px; }
  .risk-signal { color: color-mix(in srgb, var(--risk-color) 78%, white); border-color: color-mix(in srgb, var(--risk-color) 22%, transparent); background: color-mix(in srgb, var(--risk-color) 7%, transparent); }
  .risk-signal i { background: var(--risk-color); box-shadow: 0 0 0 4px color-mix(in srgb, var(--risk-color) 10%, transparent), 0 0 10px var(--risk-color); }
  .risk-console__body { display: flex; min-height: 160px; align-items: center; gap: 22px; }
  .risk-orbit { position: relative; display: grid; width: 96px; height: 96px; flex: 0 0 96px; place-items: center; }
  .risk-orbit::before { position: absolute; inset: 2px; content: ""; border: 1px dashed color-mix(in srgb, var(--risk-color) 33%, transparent); border-radius: 50%; animation: orbit-spin 20s linear infinite reverse; }

  .metric-card__icon { display: grid; width: 39px; height: 39px; flex: 0 0 39px; place-items: center; color: var(--metric-color); border: 1px solid color-mix(in srgb, var(--metric-color) 24%, transparent); border-radius: 11px; background: color-mix(in srgb, var(--metric-color) 8%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--metric-color) 8%, transparent); }
  .metric-card__icon i { font-size: 15px; }

  .metric-card__copy > span { display: block; overflow: hidden; color: var(--muted); font-size: 8px; font-weight: 750; letter-spacing: 0.08em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }

  .metric-card__trend { position: absolute; top: 12px; right: 12px; z-index: 1; color: color-mix(in srgb, var(--metric-color) 56%, #7890a4); font-size: 8px; opacity: 0.66; }

  .forecast-panel, .map-panel, .chart-panel, .dss-panel { overflow: hidden; }

  .panel-heading__meta, .chart-legend-hint { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 9px; font-weight: 600; white-space: nowrap; }

  .loading-spinner { display: inline-block; width: 17px; height: 17px; flex: 0 0 17px; border: 2px solid rgba(105, 216, 255, 0.16); border-top-color: var(--cyan); border-radius: 50%; animation: orbit-spin 0.75s linear infinite; }

  .forecast-card { position: relative; min-height: 149px; overflow: hidden; padding: 13px; border: 1px solid rgba(125, 209, 255, 0.11); border-radius: var(--radius-md); background: rgba(11, 28, 47, 0.68); scroll-snap-align: start; transition: 0.2s ease; }

  .forecast-card__rain strong { color: #74d8ff; font-weight: 700; }
  .rain-track { height: 3px; margin-top: 5px; overflow: hidden; border-radius: 99px; background: rgba(105, 165, 194, 0.12); }
  .rain-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #557cff, var(--cyan)); box-shadow: 0 0 8px rgba(69, 220, 255, 0.35); }

  .map-panel { padding: 0; }
  .panel-heading--map { margin: 0; padding: 20px 21px; }

  .map-meta-line > span { display: inline-flex; align-items: center; }
  .map-data-attribution { color: #7894a8; }
  .map-data-attribution i { color: var(--normal) !important; }
  .map-data-attribution a { color: #8eb8ca; text-decoration-color: rgba(142, 184, 202, 0.42); text-underline-offset: 2px; }
  .map-data-attribution a:hover { color: var(--cyan-bright); }
  .layer-switcher { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
  .layer-button { display: inline-flex; min-height: 36px; align-items: center; gap: 6px; padding: 0 11px; color: var(--muted); border: 1px solid rgba(127, 210, 255, 0.13); border-radius: 9px; background: rgba(10, 28, 47, 0.68); font-size: 9px; font-weight: 700; transition: 0.2s ease; }
  .layer-button:hover { color: var(--text); border-color: rgba(69, 220, 255, 0.28); }
  .layer-button.active { color: #07141c; border-color: transparent; background: linear-gradient(135deg, var(--cyan-bright), var(--cyan)); box-shadow: 0 7px 22px rgba(69, 220, 255, 0.16); }
  .layer-button--boundary.active { color: #a9ead2; border-color: rgba(52, 211, 153, 0.34); background: rgba(52, 211, 153, 0.1); box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.04), 0 0 20px rgba(52, 211, 153, 0.08); }
  .map-stage { position: relative; height: clamp(440px, calc(100vh - 290px), 710px); min-height: 440px; overflow: hidden; border-top: 1px solid var(--border); background: #07101c; }
  .map-stage iframe { display: block; width: 100%; height: 100%; border: 0; filter: saturate(0.82) contrast(1.04); }
  .map-stage.is-boundary-locked iframe { pointer-events: none; }
  .map-loading { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--text-soft); background: rgba(5, 15, 27, 0.76); backdrop-filter: blur(6px); font-size: 10px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
  .map-stage.is-loading .map-loading { opacity: 1; }
  .map-boundary-overlay { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; overflow: visible; pointer-events: none; opacity: 1; transition: opacity 0.2s ease; }
  .map-boundary-glow, .map-boundary-shape { fill-rule: evenodd; vector-effect: non-scaling-stroke; }
  .map-boundary-glow { fill: transparent; stroke: rgba(69, 220, 255, 0.24); stroke-width: 11; filter: drop-shadow(0 0 12px rgba(69, 220, 255, 0.9)); }
  .map-boundary-shape { fill: rgba(33, 204, 255, 0.11); stroke: #67e4ff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(69, 220, 255, 0.95)); }
  .map-boundary-label { position: absolute; z-index: 3; display: flex; align-items: center; gap: 6px; padding: 7px 10px; color: #dffaff; border: 1px solid rgba(69, 220, 255, 0.34); border-radius: 9px; background: rgba(3, 18, 30, 0.84); box-shadow: 0 8px 24px rgba(0, 5, 12, 0.34), 0 0 20px rgba(69, 220, 255, 0.1); font-size: 9px; font-weight: 800; letter-spacing: 0.02em; pointer-events: none; transform: translate(-50%, -50%); transition: opacity 0.2s ease; backdrop-filter: blur(10px); }
  .map-boundary-label i { color: var(--cyan); }
  .map-boundary-mode { position: absolute; top: 12px; left: 12px; z-index: 3; display: flex; align-items: center; gap: 6px; padding: 7px 9px; color: #a9ead2; border: 1px solid rgba(52, 211, 153, 0.23); border-radius: 9px; background: rgba(3, 20, 29, 0.82); font-size: 8px; font-weight: 700; pointer-events: none; transition: opacity 0.2s ease; backdrop-filter: blur(10px); }
  .map-boundary-mode i { color: var(--normal); }
  .map-stage:not(.is-boundary-locked) .map-boundary-overlay,
  .map-stage:not(.is-boundary-locked) .map-boundary-label,
  .map-stage:not(.is-boundary-locked) .map-boundary-mode { opacity: 0; }

  .analytics-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .analytics-kpi { min-height: 95px; gap: 13px; padding: 16px 18px; border-radius: var(--radius-lg); }
  .analytics-kpi__icon { display: grid; width: 41px; height: 41px; flex: 0 0 41px; place-items: center; border: 1px solid; border-radius: 12px; }
  .analytics-kpi__icon--temp { color: #ff8b8b; border-color: rgba(255, 139, 139, 0.2); background: rgba(255, 139, 139, 0.07); }
  .analytics-kpi__icon--rain { color: var(--cyan); border-color: rgba(69, 220, 255, 0.2); background: rgba(69, 220, 255, 0.07); }
  .analytics-kpi__icon--wind { color: #9d9aff; border-color: rgba(157, 154, 255, 0.2); background: rgba(157, 154, 255, 0.07); }
  .analytics-kpi > span:last-child { display: flex; min-width: 0; flex-direction: column; }
  .analytics-kpi small { color: var(--muted); font-size: 8px; font-weight: 750; letter-spacing: 0.09em; text-transform: uppercase; }
  .analytics-kpi strong { margin: 2px 0; color: var(--text); font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.04em; }
  .analytics-kpi em { color: #728a9f; font-size: 8px; font-style: normal; }

  .chart-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(330px, 0.85fr); gap: 14px; }
  .chart-panel { padding: 20px; }
  .panel-heading--compact { min-height: 39px; margin-bottom: 12px; }
  .chart-stage { position: relative; height: clamp(290px, 43vh, 430px); }
  .chart-stage canvas { width: 100% !important; height: 100% !important; }
  .chart-legend-hint { padding: 6px 9px; border: 1px solid rgba(255, 121, 132, 0.14); border-radius: 999px; background: rgba(255, 121, 132, 0.05); }
  .chart-legend-hint i { width: 14px; height: 2px; border-radius: 99px; background: #ff7984; box-shadow: 0 0 7px rgba(255, 121, 132, 0.4); }
  .chart-legend-hint--blue { border-color: rgba(69, 220, 255, 0.15); background: rgba(69, 220, 255, 0.05); }
  .chart-legend-hint--blue i { background: var(--cyan); box-shadow: 0 0 7px rgba(69, 220, 255, 0.4); }

  .dss-intro { min-height: 105px; gap: 17px; margin-bottom: 14px; padding: 19px 21px; overflow: hidden; }
  .dss-intro::after { position: absolute; top: -95px; right: 18%; width: 200px; height: 200px; content: ""; border: 1px solid rgba(69, 220, 255, 0.08); border-radius: 50%; box-shadow: inset 0 0 0 35px rgba(69, 220, 255, 0.015); }
  .dss-intro__icon { display: grid; width: 51px; height: 51px; flex: 0 0 51px; place-items: center; color: var(--cyan); border: 1px solid rgba(69, 220, 255, 0.22); border-radius: 15px; background: rgba(69, 220, 255, 0.07); box-shadow: 0 0 24px rgba(69, 220, 255, 0.08); }
  .dss-intro__icon i { font-size: 19px; }
  .dss-intro > div:nth-child(2) { min-width: 0; }
  .dss-intro h2 { margin: 0; color: var(--text); font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.025em; }
  .dss-intro p { margin: 3px 0 0; color: var(--muted); font-size: 9px; }
  .dss-status { z-index: 1; margin-left: auto; padding: 8px 11px; }
  .dss-status[data-risk="waspada"] { color: #f7cd83; border-color: rgba(253, 183, 75, 0.22); background: rgba(253, 183, 75, 0.08); }
  .dss-status[data-risk="waspada"] > span { background: var(--warning); box-shadow: 0 0 0 4px rgba(253, 183, 75, 0.1), 0 0 10px rgba(253, 183, 75, 0.65); }
  .dss-status[data-risk="siaga"] { color: #ffb4be; border-color: rgba(255, 99, 119, 0.25); background: rgba(255, 99, 119, 0.09); }
  .dss-status[data-risk="siaga"] > span { background: var(--danger); box-shadow: 0 0 0 4px rgba(255, 99, 119, 0.1), 0 0 10px rgba(255, 99, 119, 0.65); }

  .dss-grid { display: grid; grid-template-columns: minmax(280px, 0.76fr) minmax(0, 1.24fr); gap: 14px; }
  .dss-panel { min-height: 390px; padding: 20px; }
  .panel-heading__icon { color: #7fa2ba; font-size: 16px; }
  .risk-reasons, .recommendation-list { display: flex; flex-direction: column; gap: 9px; }
  .risk-reason { display: flex; align-items: flex-start; gap: 11px; padding: 13px; border: 1px solid rgba(125, 209, 255, 0.11); border-radius: var(--radius-md); background: rgba(9, 27, 46, 0.58); }
  .risk-reason__icon { display: grid; width: 29px; height: 29px; flex: 0 0 29px; place-items: center; color: var(--warning); border-radius: 9px; background: rgba(253, 183, 75, 0.08); }
  .risk-reason--normal .risk-reason__icon { color: var(--normal); background: rgba(52, 211, 153, 0.08); }
  .risk-reason span:last-child { min-width: 0; }
  .risk-reason small { display: block; margin-bottom: 2px; color: var(--muted); font-size: 7px; font-weight: 750; letter-spacing: 0.1em; text-transform: uppercase; }
  .risk-reason p { margin: 0; color: var(--text-soft); font-size: 10px; line-height: 1.45; }
  .recommendation-item { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 11px; align-items: start; padding: 14px; border: 1px solid rgba(125, 209, 255, 0.11); border-radius: var(--radius-md); background: linear-gradient(100deg, rgba(31, 100, 137, 0.13), rgba(9, 27, 46, 0.58)); transition: 0.2s ease; }
  .recommendation-item:hover { border-color: rgba(69, 220, 255, 0.24); transform: translateX(2px); }
  .recommendation-item__number { display: grid; width: 30px; height: 30px; place-items: center; color: #07141d; border-radius: 9px; background: linear-gradient(145deg, var(--cyan-bright), var(--cyan)); font-family: var(--font-display); font-size: 10px; font-weight: 700; box-shadow: 0 7px 18px rgba(69, 220, 255, 0.12); }
  .recommendation-item small { display: block; margin-bottom: 3px; color: var(--cyan); font-size: 7px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .recommendation-item p { margin: 0; color: var(--text-soft); font-size: 10px; line-height: 1.5; }
  .content-loading { display: flex; min-height: 185px; align-items: center; justify-content: center; gap: 9px; color: var(--muted); font-size: 10px; }

  .dashboard-footer { justify-content: space-between; gap: 20px; margin-top: 18px; padding: 8px 4px 0; color: #627a8e; font-size: 8px; }
  .dashboard-footer i { margin-right: 5px; color: var(--cyan); }

  .dashboard-toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 1300;
    display: flex;
    max-width: min(380px, calc(100vw - 28px));
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    color: #ffd0d6;
    border: 1px solid rgba(255, 99, 119, 0.27);
    border-radius: 12px;
    background: rgba(55, 17, 28, 0.94);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.38);
    font-size: 10px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity 0.22s ease, transform 0.22s ease;
    backdrop-filter: blur(16px);
  }
  .dashboard-toast.show { opacity: 1; transform: none; }
  .dashboard-toast i { color: var(--danger); }

  @media (max-width: 1300px) {
    .brand-copy p { display: none; }
    .header-operations { gap: 13px; }
    .overview-grid { grid-template-columns: minmax(0, 1.35fr) minmax(310px, 0.8fr); }
    .metric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .chart-grid { grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.8fr); }
  }

  @media (max-width: 1050px) {
    .command-header { align-items: flex-start; }
    .time-console { min-width: 150px; }
    .time-console__meta span:first-child { display: none; }
    .context-strip__item--compact:nth-of-type(2), .context-divider:nth-of-type(2) { display: none; }
    .overview-grid, .chart-grid { grid-template-columns: 1fr; }

    .chart-stage { height: 330px; }
  }

  @media (max-width: 820px) {

    .brand-block { width: 100%; }
    .brand-copy h1 { white-space: normal; }

    .time-console { min-width: 0; text-align: left; }
    .time-console__clock { font-size: 17px; }
    .time-console__meta { font-size: 8px; }

    .context-strip { gap: 10px; }
    .context-strip__item--compact { display: none; }
    .context-divider { display: none; }
    .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .analytics-summary { grid-template-columns: 1fr; }
    .analytics-kpi { min-height: 82px; }
    .dss-grid { grid-template-columns: 1fr; }
    .dss-panel { min-height: auto; }
    .panel-heading--map { align-items: flex-start; flex-direction: column; }
    .layer-switcher { justify-content: flex-start; }
    .map-stage { height: 62vh; min-height: 420px; }
    .dashboard-footer { align-items: flex-start; flex-direction: column; gap: 4px; }
  }

  @media (max-width: 575px) {
    .brand-emblem { width: 48px; height: 55px; flex-basis: 48px; }
    .brand-emblem__image { height: 53px; }
    .brand-copy h1 { font-size: 16px; }
    .brand-kicker { font-size: 7px; letter-spacing: 0.12em; }
    .header-operations { padding-left: 0; }
